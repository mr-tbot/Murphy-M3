; Murphy M3 — ESP32-S3R8, UC8253 416x240 + CHSC6x touch + frontlight + 4-bit
; SDMMC microSD. Uses the freeink-sdk submodule on branch m3-tbot (corrected
; Murphy SDMMC wiring). Mirrors [env:sticky].
[env:murphy]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_MURPHY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-murphy\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; 4-bit SDMMC needs SdFat's generic block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
